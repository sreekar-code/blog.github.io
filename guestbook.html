<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guestbook — Sreekar Scribbles</title>
    <link rel="stylesheet" href="styles.css?v=47">
    <script async src="https://analytics.balla.dev/script.js" data-website-id="2d661ca0-e926-4c3c-8d8c-e948998a7ac8"></script>
    <style>
        .guestbook-form { margin-top: 1em; }
        .form-field { margin-bottom: 1em; }
        .form-field label {
            display: block;
            margin-bottom: 0.05em;
            font-size: 0.8em;
            opacity: 0.7;
        }
        .form-field input,
        .form-field textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 0.1em 0;
            font-family: 'Kalam', cursive;
            font-size: 0.9em;
            color: #1a0f04;
            background: transparent;
            border: none;
            border-bottom: 1.5px solid rgba(140, 100, 40, 0.75);
            outline: none;
            line-height: 1.6;
        }
.form-field textarea {
            resize: none;
            min-height: 80px;
        }
        .form-field input:focus,
        .form-field textarea:focus {
            border-bottom-color: rgba(140, 100, 40, 0.8);
        }
        .form-submit { margin-top: 2em; }
        .form-submit button {
            font-family: 'Kalam', cursive;
            font-size: 0.85em;
            color: rgba(26, 15, 4, 0.65);
            background: #f4ecce;
            border: 1.5px solid rgba(140, 100, 40, 0.6);
            padding: 0.3em 1.4em;
            cursor: pointer;
            border-radius: 2px;
            box-shadow: 2px 3px 0px rgba(140, 100, 40, 0.35);
        }
        .form-submit button:hover {
            box-shadow: 1px 1px 0px rgba(140, 100, 40, 0.35);
            transform: translate(1px, 2px);
        }
        .form-success {
            display: none;
            font-style: italic;
            opacity: 0.7;
            margin-top: 1em;
        }
    </style>
</head>
<body>
<main>
    <header class="blogtitle">Sreekar Scribbles</header>
    <p><a href="index.html">Home</a> &nbsp;&nbsp; <a href="blog.html">Blog</a> &nbsp;&nbsp; <a href="notes.html">Notes</a> &nbsp;&nbsp; <a href="poems.html">Poems</a> &nbsp;&nbsp; Guestbook &nbsp;&nbsp; <a href="mailto:sreekarscribbles@gmail.com">Let's connect</a></p>
    <hr>
    <h1>Drop a note</h1>
    <section>
        <p>Say hi. Leave a thought. I read every one.</p>
    </section>
    <section>
        <form class="guestbook-form" id="guestbook-form">
            <div class="form-field">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" required>
            </div>
            <div class="form-field">
                <label for="blog">Your blog (if you have one)</label>
                <input type="url" id="blog" name="blog">
            </div>
            <div class="form-field">
                <label for="email">Email (so I can reach out, won't be public)</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="form-field">
                <label for="message">Something you'd like to say</label>
                <textarea id="message" name="message" required></textarea>
            </div>
            <div class="form-submit">
                <button type="submit">Submit</button>
            </div>
        </form>
        <p class="form-success" id="form-success">Got it. Thank you.</p>
    </section>
</main>
<script src="nav.js?v=3"></script>
<script>
    const form = document.getElementById('guestbook-form');
    const success = document.getElementById('form-success');

    form.addEventListener('submit', async function(e) {
        e.preventDefault();
        const data = new FormData(form);
        const res = await fetch('https://formspree.io/f/xzepajng', {
            method: 'POST',
            body: data,
            headers: { 'Accept': 'application/json' }
        });
        if (res.ok) {
            form.style.display = 'none';
            success.style.display = 'block';
        }
    });
</script>
</body>
</html>
