<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poems — Sreekar Scribbles</title>
    <link rel="stylesheet" href="styles.css?v=47">
    <script async src="https://analytics.balla.dev/script.js" data-website-id="2d661ca0-e926-4c3c-8d8c-e948998a7ac8"></script>
    <style>
        .poems-stack {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 5rem;
            padding: 2rem 0 6rem;
            width: 100%;
        }

        /* outer wrapper handles rotation */
        .poem-wrapper {
            width: 100%;
        }
        .poem-wrapper:nth-child(odd)  { transform: rotate(-2deg); }
        .poem-wrapper:nth-child(even) { transform: rotate(1.5deg); }

        /* container holds both the paper layer and the text layer */
        .poem-outer {
            position: relative;
            width: 100%;
            max-width: 420px;
            margin: 0 auto;
        }

        /* the crumpled paper background — filter applied here only */
        .poem-paper {
            position: absolute;
            inset: 0;
            background: #faf6e4;
            filter: url(#crumple);
        }

        /* text sits on top, clean and unfiltered */
        .poem-card {
            position: relative;
            z-index: 1;
            padding: 1.6rem 2.4rem 1.8rem;
            color: #1c0d05;
            text-align: center;
        }

        .poem-title {
            font-size: 0.8em;
            opacity: 0.38;
            margin-bottom: 1.4rem;
        }

        .poem-body {
            white-space: pre-line;
            line-height: 2;
            font-size: 0.95em;
        }

        @media (max-width: 600px) {
            .poems-stack { gap: 4rem; }
            .poem-outer { max-width: 100%; margin: 0; }
            .poem-card { padding: 1.4rem 1.6rem 1.6rem; }
            .poem-wrapper:nth-child(odd)  { transform: rotate(-1.2deg); }
            .poem-wrapper:nth-child(even) { transform: rotate(0.8deg); }
        }
    </style>
</head>
<body>

<svg xmlns="http://www.w3.org/2000/svg" style="position:absolute;width:0;height:0;overflow:hidden">
  <defs>
    <filter id="crumple" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02 0.028" numOctaves="4" seed="9" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="16" xChannelSelector="R" yChannelSelector="G" result="warped"/>
      <feDropShadow dx="4" dy="9" stdDeviation="11" flood-color="#000" flood-opacity="0.52"/>
    </filter>
  </defs>
</svg>

    <main>
    <section>
        <p>Sometimes, you don't need a lot of words.</p>
    </section>
    <section>
    <div class="poems-stack">

        <div class="poem-wrapper">
            <div class="poem-outer">
                <div class="poem-paper"></div>
                <div class="poem-card">
                    <div class="poem-title">Both, somehow</div>
                    <div class="poem-body">Light's wave
light's particle

cat's alive
cat's dead

love's this
love's that

both, somehow.</div>
                </div>
            </div>
        </div>

    </div>
    </section>
