<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poems — Sreekar Scribbles</title>
    <link rel="stylesheet" href="styles.css?v=47">
    <script async src="https://analytics.balla.dev/script.js" data-website-id="2d661ca0-e926-4c3c-8d8c-e948998a7ac8"></script>
    <style>
        .poems-stack {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 4rem;
            padding: 1.5rem 0 5rem;
        }

        /* wrapper carries the drop-shadow so it respects the torn clip-path */
        .poem-wrapper {
            filter: drop-shadow(3px 10px 26px rgba(0,0,0,0.7));
        }
        .poem-wrapper:nth-child(odd)  { transform: rotate(-1.5deg); }
        .poem-wrapper:nth-child(even) { transform: rotate(1deg); }

        .poem-card {
            background:
                /* diagonal crumple highlight */
                linear-gradient(128deg, transparent 36%, rgba(255,255,255,0.55) 44%, transparent 52%),
                /* bottom-left fold shadow */
                radial-gradient(ellipse 55% 35% at 8% 96%, rgba(0,0,0,0.1) 0%, transparent 100%),
                /* top-right corner crinkle */
                radial-gradient(ellipse 40% 30% at 92% 4%, rgba(0,0,0,0.06) 0%, transparent 100%),
                /* aged paper — lighter centre, warmer edges */
                radial-gradient(ellipse at 50% 40%, #f8f1d8 10%, #e8d89e 100%);
            color: #1a0e06;
            padding: 3.2rem 2.4rem 2.8rem;
            max-width: 370px;
            width: 100%;
            /* torn top edge — as if ripped from a notebook */
            clip-path: polygon(
                0% 3.5%, 2% 1%, 4% 4.5%, 6% 0.5%, 8% 3%, 10% 0%, 12% 4%, 14% 1.5%,
                16% 3.5%, 18% 0.5%, 20% 4.5%, 22% 1%, 24% 3%, 26% 0%, 28% 5%, 30% 1.5%,
                32% 4%, 34% 0.5%, 36% 3.5%, 38% 1%, 40% 4.5%, 42% 0%, 44% 3%, 46% 1.5%,
                48% 4%, 50% 0.5%, 52% 3.5%, 54% 1%, 56% 4.5%, 58% 0%, 60% 3%, 62% 1.5%,
                64% 4%, 66% 0.5%, 68% 3.5%, 70% 1%, 72% 5%, 74% 1.5%, 76% 3.5%, 78% 0.5%,
                80% 4%, 82% 1%, 84% 3.5%, 86% 0%, 88% 4.5%, 90% 1.5%, 92% 3%, 94% 0.5%,
                96% 4%, 98% 1%, 100% 3.5%,
                100% 100%, 0% 100%
            );
        }

        .poem-title {
            font-size: 0.75em;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            opacity: 0.4;
            margin-bottom: 1.4rem;
        }

        .poem-body {
            white-space: pre-line;
            line-height: 2.1;
            font-size: 1.1em;
        }

        @media (max-width: 600px) {
            .poems-stack { gap: 3rem; padding: 1rem 0 4rem; }
            .poem-card { max-width: 100%; padding: 2.8rem 1.8rem 2.4rem; }
            .poem-wrapper:nth-child(odd)  { transform: rotate(-0.8deg); }
            .poem-wrapper:nth-child(even) { transform: rotate(0.6deg); }
        }
    </style>
</head>
<body>
    <header class="blogtitle">Poems</header>
    <p><a href="index.html">Home</a> &nbsp;&nbsp; <a href="blog.html">Blog</a> &nbsp;&nbsp; <a href="notes.html">Notes</a> &nbsp;&nbsp; Poems &nbsp;&nbsp; <a href="mailto:sreekarscribbles@gmail.com">Let's connect</a></p>
    <hr>
    <main>
    <section>
        <p>Sometimes, you don't need a lot of words.</p>
    </section>
    <section>
    <div class="poems-stack">

        <div class="poem-wrapper">
            <div class="poem-card">
                <div class="poem-title">Both, somehow</div>
                <div class="poem-body">Light's wave
light's particle

cat's alive
cat's dead

love's this
love's that.</div>
            </div>
        </div>

    </div>
    </section>
    </main>
<script src="nav.js?v=3"></script>
</body>
</html>
