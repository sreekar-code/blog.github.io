    <style>
        .poems-stack {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 3.5rem;
            padding: 1rem 0 5rem;
        }

        .poem-card {
            background: #fdfaf2;
            color: #1a0e06;
            padding: 2.4rem 2.8rem 2.8rem;
            max-width: 340px;
            width: 100%;
            box-shadow: 2px 4px 14px rgba(0,0,0,0.3);
        }

        .poem-wrapper:nth-child(odd)  { transform: rotate(-1deg); }
        .poem-wrapper:nth-child(even) { transform: rotate(0.8deg); }

        .poem-title {
            font-size: 0.8em;
            opacity: 0.4;
            margin-bottom: 1.2rem;
        }

        .poem-body {
            white-space: pre-line;
            line-height: 2.2;
            font-size: 1.1em;
        }

        @media (max-width: 600px) {
            .poem-card { max-width: 100%; padding: 2rem 1.8rem 2.4rem; }
            .poem-wrapper:nth-child(odd)  { transform: rotate(-0.5deg); }
            .poem-wrapper:nth-child(even) { transform: rotate(0.4deg); }
        }
    </style>
</head>

    <main>
    <section>
        <p>Sometimes, you don't need a lot of words.</p>
    </section>
    <section>
    <div class="poems-stack">

        <div class="poem-wrapper">
            <div class="poem-card">
                <div class="poem-title">Both, somehow</div>
                <div class="poem-body">Light's wave
light's particle

cat's alive
cat's dead

love's this
love's that.</div>
            </div>
        </div>

    </div>
    </section>
